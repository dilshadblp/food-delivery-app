server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/api/auth/** ]
          filters: [ StripPrefix=0 ]
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0
        # Demo route: http://localhost:8080/api/httpbin/get -> https://httpbin.org/get
        - id: httpbin-get
          uri: https://httpbin.org
          predicates:
            - Path=/api/httpbin/**
          filters:
            - StripPrefix=2
            # Later you can add real rate limiter:
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always


security:
  jwt:
    # HS256 secret for now (32+ chars). Later we’ll switch to RSA keys + JWKS.
    secret: "this-is-a-dev-only-secret-change-in-prod-1234567890"
    public-key: |
      -----BEGIN PUBLIC KEY-----
      
      -----END PUBLIC KEY-----